{% extends "base.html" %}

{% block title %}Utenti{% endblock %}
{% block header %}Impostazioni Utenti{% endblock %}

{% block content %}
<table id="userstable">
  {% for email in users %}
  <tr>
    <td>{{email}}</td>
    <td>{{ users[email]['name'] }}</td>
    <td>{{ ', '.join(users[email]['roles']) }}</td>
    <td>Modifica Elimina</td>
  </tr>
  {% endfor %}
</table>
{% endblock %}
